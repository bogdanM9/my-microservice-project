# Local development only. Nothing in this file is used on AWS: there the image
# is built by Jenkins with Kaniko and the database is the RDS instance that
# modules/rds creates.
#
#   docker compose up --build
#   open http://localhost:8000
#
# The application reads exactly the same environment variables here as it does
# in the cluster, so the code path is identical and only the values differ.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "1"
      APP_ENVIRONMENT: local
      APP_VERSION: dev
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: appdb
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: localdev
    ports:
      - "8000:8000"

volumes:
  pgdata:
